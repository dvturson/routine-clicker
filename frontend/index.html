        <div id="square"></div>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            const square = document.getElementById("square");

            if (square.style.backgroundColor === "green") {
                square.style.backgroundColor = "white";
            } else {

            }
        }
